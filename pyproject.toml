[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ChatCube"
dynamic = ["version"]
description = "ChatCube: ChatArch placeholder package for cube workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["click>=8.1,<9.0", "chatstyle>=0.1.0,<0.2.0", "chatenv>=0.2.0,<0.3.0"]
authors = [{name = "ChatArch", email = "1073853456@qq.com"}]
keywords = ["chatcube", "chatarch", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://arch.gh.wzhecnu.cn/ChatCube/"
Documentation = "https://arch.gh.wzhecnu.cn/ChatCube/"
Repository = "https://github.com/ChatArch/ChatCube"

[project.scripts]
chatcube = "chatcube.cli:main"

[project.entry-points."chatenv.configs"]
chatcube = "chatcube.config"

[project.optional-dependencies]
dev = ["build", "pytest", "twine"]
docs = ["mkdocs>=1.6,<2.0", "mkdocs-material>=9.5,<10.0", "mkdocs-static-i18n>=1.2,<2.0", "mike>=2.0,<3.0"]

[tool.setuptools.dynamic]
version = {attr = "chatcube.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true
